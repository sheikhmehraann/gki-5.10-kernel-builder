name: Build GKI 5.10.270 Kernel (KSU & noSU)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Kernel (${{ matrix.variant }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [KSU, noSU]

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev python3 libelf-dev \
            curl git zip tar xz-utils zlib1g-dev libncurses-dev ccache \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Setup LLVM / Clang Toolchain
        run: |
          mkdir -p toolchain
          echo "[+] Downloading LLVM 17 toolchain..."
          curl -fL "https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-17.0.6-x86_64.tar.xz" | tar -xJf - -C toolchain --strip-components=1 || {
            echo "[!] LLVM 17 not found, trying LLVM 18..."
            curl -fL "https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-18.1.8-x86_64.tar.xz" | tar -xJf - -C toolchain --strip-components=1
          }
          echo "${GITHUB_WORKSPACE}/toolchain/bin" >> $GITHUB_PATH

      - name: Fetch Android Common Kernel 5.10
        run: |
          echo "[+] Cloning Android Common Kernel 5.10..."
          git clone --depth 1 -b android12-5.10-stg-damon \
            https://github.com/ramabondanp/android_kernel_common-5.10.git kernel_src
          cd kernel_src

          # Set sublevel to 270 (Linux 5.10.270)
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 270/' Makefile
          sed -i 's/^EXTRAVERSION = .*/EXTRAVERSION =/' Makefile
          echo "[+] Kernel sublevel set to 5.10.270"

      - name: Integrate SukiSU-Ultra (for KSU variant)
        if: matrix.variant == 'KSU'
        run: |
          cd kernel_src
          echo "[+] Setting up SukiSU-Ultra (supports KSU Latest, KSU-Next, SukiSU Ultra)..."
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main

          # Ensure driver entries exist
          grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          # Ensure driver version is 40900 (UAPI v2) for full compatibility with all latest managers
          find drivers/kernelsu/ KernelSU/ -name "Kbuild" 2>/dev/null | while read -r f; do
            echo "ccflags-y += -DKSU_VERSION=40900 -DKSU_VERSION_FULL=\\\"v4.2.0-Mehraan-Ultra\\\"" >> "$f"
          done

          # Apply Universal Multi-Manager Support (Official KSU, KSU-Next, SukiSU Ultra)
          echo "[+] Applying Universal Multi-Manager patches..."
          cp -vf ../patches/manager_identity.h KernelSU/kernel/manager/manager_identity.h
          cp -vf ../patches/apk_sign.c KernelSU/kernel/manager/apk_sign.c
          cp -vf ../patches/throne_tracker.c KernelSU/kernel/manager/throne_tracker.c
          cp -vf ../patches/allowlist.c KernelSU/kernel/policy/allowlist.c
          cp -vf ../patches/dispatch.c KernelSU/kernel/supercall/dispatch.c
          cp -vf ../patches/supercall.h KernelSU/uapi/supercall.h

          echo "[+] SukiSU-Ultra integrated and patched for all managers."

      - name: Configure Kernel
        run: |
          cd kernel_src
          mkdir -p out

          echo "-Mehraan-5.10.270-${{ matrix.variant }}" > .scmversion

          make O=out ARCH=arm64 SUBARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            gki_defconfig

          # Common config: ThinLTO for fast CI builds, DAMON, disable WERROR
          scripts/config --file out/.config \
            -e LTO_CLANG -e LTO_CLANG_THIN -d LTO_CLANG_FULL -d LTO_NONE \
            -e DAMON \
            -d WERROR \
            --set-val CONFIG_FRAME_WARN 4096

          if [ "${{ matrix.variant }}" = "KSU" ]; then
            echo "[+] Configuring with SukiSU-Ultra root support..."
            scripts/config --file out/.config \
              -e KSU -e OVERLAY_FS \
              -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS
          else
            echo "[+] Configuring noSU (pure stock kernel, NO ROOT)..."
            scripts/config --file out/.config \
              -d KSU -d OVERLAY_FS
          fi

          make O=out ARCH=arm64 SUBARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            olddefconfig

      - name: Compile Kernel (Image)
        run: |
          cd kernel_src
          make -j$(nproc --all) O=out \
            ARCH=arm64 SUBARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            KCFLAGS="-Wno-error" \
            Image

      - name: Package AnyKernel3 Zip
        run: |
          mkdir -p artifacts
          
          # Ensure fresh upstream AnyKernel3 template
          rm -rf tools/AnyKernel3
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git tools/AnyKernel3

          # Use clean universal GKI AnyKernel3 template
          cp -vf tools/anykernel_template.sh tools/AnyKernel3/anykernel.sh
          sed -i "s/VARIANT/${{ matrix.variant }}/" tools/AnyKernel3/anykernel.sh
          rm -rf tools/AnyKernel3/ramdisk/overlay.d
          
          # Use modern Header v4-compatible magiskboot
          if [ -f "tools/magiskboot_arm64" ]; then
            cp -vf tools/magiskboot_arm64 tools/AnyKernel3/tools/magiskboot
            chmod +x tools/AnyKernel3/tools/magiskboot
          fi
          
          cp -v kernel_src/out/arch/arm64/boot/Image tools/AnyKernel3/Image
          cd tools/AnyKernel3
          zip -r9 "../../artifacts/AK3-GKI-5.10.270-Mehraan-${{ matrix.variant }}.zip" * -x ".git*" "README.md" "*.zip"
          cd ../..

      - name: Repack Stock boot.img
        run: |
          if [ -f "Stockimgs/boot.img" ]; then
            echo "[+] Repacking Stockimgs/boot.img with new kernel..."
            python3 tools/repack_boot.py Stockimgs/boot.img \
              kernel_src/out/arch/arm64/boot/Image \
              "artifacts/boot-5.10.270-Mehraan-${{ matrix.variant }}.img"
          else
            echo "[-] No Stockimgs/boot.img found, skipping repack."
          fi

      - name: Include Latest Root Managers in Artifacts (for KSU variant)
        if: matrix.variant == 'KSU'
        run: |
          if [ -d "managers" ]; then
            echo "[+] Copying latest Root Managers to artifacts..."
            cp -vf managers/*.apk artifacts/
          fi

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GKI-5.10.270-Kernel-By-Mehraan-${{ matrix.variant }}
          path: artifacts/*
          if-no-files-found: error
