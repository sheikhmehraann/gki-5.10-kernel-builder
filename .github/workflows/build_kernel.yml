name: Build GKI 5.10 Kernel with KernelSU

on:
  workflow_dispatch:
    inputs:
      ksu_tag:
        description: 'KernelSU tag (e.g. v1.0.5)'
        required: true
        default: 'v1.0.5'

jobs:
  build:
    name: Build Kernel 5.10
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev python3 libelf-dev \
            curl git zip tar xz-utils zlib1g-dev libncurses-dev ccache \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Setup LLVM / Clang Toolchain
        run: |
          mkdir -p toolchain
          # Use a stable LLVM 17 release — proven compatible with 5.10 GKI builds
          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz"
          echo "[+] Downloading Android Clang toolchain..."
          # Fallback: use kernel.org LLVM 17 if Android prebuilt fails
          curl -fL "https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-17.0.6-x86_64.tar.xz" | tar -xJf - -C toolchain --strip-components=1 || {
            echo "[!] LLVM 17 not found, trying LLVM 18..."
            curl -fL "https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-18.1.8-x86_64.tar.xz" | tar -xJf - -C toolchain --strip-components=1
          }
          echo "${GITHUB_WORKSPACE}/toolchain/bin" >> $GITHUB_PATH

      - name: Fetch Android Common Kernel 5.10
        run: |
          echo "[+] Cloning Android Common Kernel 5.10 (Rama982 DAMON tree)..."
          git clone --depth 1 -b android12-5.10-stg-damon \
            https://github.com/ramabondanp/android_kernel_common-5.10.git kernel_src
          cd kernel_src

          # DO NOT merge upstream v5.10.270 — it destroys Android-specific code
          # (CFI macros, security_inode_init_security_anon, vendor hooks, etc.)
          # Instead, just bump the sublevel in the Makefile for versioning.
          # Set version to 5.10.270
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 270/' Makefile
          sed -i 's/^EXTRAVERSION = .*/EXTRAVERSION =/' Makefile
          echo "[+] Kernel sublevel set to 5.10.270"

      - name: Integrate KernelSU
        run: |
          cd kernel_src
          KSU_TAG="${{ github.event.inputs.ksu_tag || 'v1.0.5' }}"
          echo "[+] Setting up KernelSU ${KSU_TAG}..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "${KSU_TAG}"

          # Ensure driver entries exist
          grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          echo "[+] KernelSU ${KSU_TAG} integrated."

      - name: Configure Kernel
        run: |
          cd kernel_src
          mkdir -p out

          echo "-Mehraan-5.10.270-KSU" > .scmversion

          make O=out ARCH=arm64 SUBARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            gki_defconfig

          # Switch Full LTO to ThinLTO (Full LTO takes 2+ hours on CI runners)
          # Enable KSU, OverlayFS, Kprobes, DAMON; disable WERROR
          scripts/config --file out/.config \
            -e LTO_CLANG -e LTO_CLANG_THIN -d LTO_CLANG_FULL -d LTO_NONE \
            -e KSU -e OVERLAY_FS \
            -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS \
            -e DAMON \
            -d WERROR \
            --set-val CONFIG_FRAME_WARN 4096

          make O=out ARCH=arm64 SUBARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            olddefconfig

      - name: Compile Kernel (Image)
        run: |
          cd kernel_src
          make -j$(nproc --all) O=out \
            ARCH=arm64 SUBARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            KCFLAGS="-Wno-error" \
            Image

      - name: Package AnyKernel3 Zip
        run: |
          mkdir -p artifacts
          # Ensure anykernel.sh has Kernel By Mehraan and correct slot/block config
          sed -i 's/kernel.string=.*/kernel.string=Kernel By Mehraan/' tools/AnyKernel3/anykernel.sh
          sed -i 's#block=.*#block=boot;#' tools/AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=auto;/' tools/AnyKernel3/anykernel.sh
          
          cp -v kernel_src/out/arch/arm64/boot/Image tools/AnyKernel3/Image
          cd tools/AnyKernel3
          zip -r9 "../../artifacts/AK3-GKI-5.10.270-KSU.zip" * -x ".git*" "README.md" "*.zip"
          cd ../..

      - name: Repack Stock boot.img
        run: |
          if [ -f "Stockimgs/boot.img" ]; then
            echo "[+] Repacking Stockimgs/boot.img with new kernel..."
            python3 tools/repack_boot.py Stockimgs/boot.img \
              kernel_src/out/arch/arm64/boot/Image \
              "artifacts/boot-5.10.270-KSU.img"
          else
            echo "[-] No Stockimgs/boot.img found, skipping repack."
          fi

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GKI-5.10-KernelSU-Build
          path: artifacts/*
          if-no-files-found: error
