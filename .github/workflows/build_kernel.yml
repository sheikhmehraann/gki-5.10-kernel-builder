name: Build Android 5.10 GKI Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: kernel-builder-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Kernel (Universal GKI 5.10)
    runs-on: ubuntu-24.04

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev python3 python-is-python3 libelf-dev \
            curl git zip tar xz-utils zlib1g-dev libncurses-dev ccache \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Cache LLVM Toolchain
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: toolchain
          key: llvm-17.0.6-x86_64-u24

      - name: Setup LLVM Toolchain
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain
          curl -fL "https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-17.0.6-x86_64.tar.xz" | tar -I "xz -T0" -xf - -C toolchain --strip-components=1

      - name: Add LLVM to PATH
        run: |
          echo "${GITHUB_WORKSPACE}/toolchain/bin" >> $GITHUB_PATH

      - name: Setup Compiler Cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-kernel-u24-${{ github.run_id }}
          restore-keys: |
            ccache-kernel-u24-

      - name: Fetch Android Common Kernel 5.10
        run: |
          git clone --depth 1 --single-branch --no-tags -b android12-5.10-stg-damon \
            https://github.com/ramabondanp/android_kernel_common-5.10.git kernel_src
          cd kernel_src
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 270/' Makefile
          sed -i 's/^EXTRAVERSION = .*/EXTRAVERSION =/' Makefile

      - name: Configure Kernel
        run: |
          cd kernel_src
          mkdir -p out

          rm -f .scmversion
          touch .scmversion
          sed -i 's/scm_version="+.*/scm_version=""/' scripts/setlocalversion 2>/dev/null || true

          export PATH="${GITHUB_WORKSPACE}/toolchain/bin:$PATH"
          export LLVM=1 LLVM_IAS=1 ARCH=arm64 LTO=thin

          make O=out gki_defconfig

          scripts/config --file out/.config \
            -e LTO_CLANG -e LTO_CLANG_THIN -d LTO_CLANG_FULL -d LTO_NONE \
            -d WERROR \
            --set-val CONFIG_FRAME_WARN 2048

          scripts/config --file out/.config \
            --set-str CONFIG_LOCALVERSION "-android12-9-00014-gf82f7360927e-ab14119954" \
            -d CONFIG_LOCALVERSION_AUTO

          scripts/config --file out/.config \
            -e KALLSYMS -e KALLSYMS_ALL \
            -e TCP_CONG_ADVANCED \
            -e TCP_CONG_BBR \
            --set-str CONFIG_DEFAULT_TCP_CONG "bbr" \
            -e NET_SCH_FQ \
            --set-str CONFIG_DEFAULT_NET_SCH "fq" \
            -e SCHED_AUTOGROUP \
            -e CPU_FREQ_GOV_PERFORMANCE \
            -e CPU_FREQ_GOV_SCHEDUTIL

          make O=out olddefconfig

      - name: Compile Kernel
        run: |
          cd kernel_src
          export PATH="${GITHUB_WORKSPACE}/toolchain/bin:$PATH"

          export CCACHE_DIR=/home/runner/.ccache
          export CCACHE_MAXSIZE=8G
          export CCACHE_COMPRESS=1
          export CCACHE_COMPRESSLEVEL=5
          ccache -s -z

          export LLVM=1 LLVM_IAS=1 ARCH=arm64 LOCALVERSION="" LTO=thin CCACHE=ccache
          export KBUILD_BUILD_USER="android-build"
          export KBUILD_BUILD_HOST="android-build"
          export KBUILD_BUILD_TIMESTAMP="Mon Jan  1 00:00:00 UTC 2026"

          make -j$(nproc --all) O=out Image
          ccache -s

      - name: Patch Kernel with KernelPatch
        run: |
          KP_VERSION="0.13.8"
          curl -fLo kptools-linux "https://github.com/bmax121/KernelPatch/releases/download/${KP_VERSION}/kptools-linux"
          curl -fLo kpimg-android "https://github.com/bmax121/KernelPatch/releases/download/${KP_VERSION}/kpimg-android"
          chmod +x kptools-linux

          IMG_SRC="${GITHUB_WORKSPACE}/kernel_src/out/arch/arm64/boot/Image"
          if [ ! -f "$IMG_SRC" ]; then
            echo "Error: $IMG_SRC not found!"
            exit 1
          fi

          ./kptools-linux -p --image "$IMG_SRC" --skey "apatch2026" --kpimg kpimg-android --out Image_patched
          ls -lh Image_patched
          mv Image_patched "$IMG_SRC"

      - name: Package Artifacts
        run: |
          mkdir -p artifacts
          IMG_SRC="${GITHUB_WORKSPACE}/kernel_src/out/arch/arm64/boot/Image"

          cp "$IMG_SRC" artifacts/Image
          gzip -9 -c "$IMG_SRC" > artifacts/Image.gz

          rm -rf tools/AnyKernel3
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git tools/AnyKernel3
          cp tools/anykernel_template.sh tools/AnyKernel3/anykernel.sh
          sed -i "s/VARIANT/APatch/" tools/AnyKernel3/anykernel.sh
          rm -rf tools/AnyKernel3/ramdisk/overlay.d

          if [ -f "tools/magiskboot_arm64" ]; then
            cp tools/magiskboot_arm64 tools/AnyKernel3/tools/magiskboot
            chmod +x tools/AnyKernel3/tools/magiskboot
          fi

          cp "$IMG_SRC" tools/AnyKernel3/Image
          (cd tools/AnyKernel3 && zip -r9 "${GITHUB_WORKSPACE}/artifacts/Kernel-5.10.270-Universal.zip" * -x ".git*" "README.md" "*.zip")

          curl -fLo artifacts/APatch_11224.apk "https://github.com/bmax121/APatch/releases/download/11224/APatch_11224_9a63e0f_HEAD-release-signed.apk"

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-5.10.270-Universal-by-Mehraan
          path: artifacts/*
          if-no-files-found: error
