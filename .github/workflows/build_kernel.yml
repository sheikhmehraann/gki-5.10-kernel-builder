name: Build Suki-Kernel & NoSU-Kernel (5.10.270) - Deep Stealth

'on':
  workflow_dispatch:
    inputs:
      variant:
        description: 'Kernel Variant to build'
        required: true
        default: 'Suki-Kernel'
        type: choice
        options:
          - Suki-Kernel
          - NoSU-Kernel
          - Both

concurrency:
  group: kernel-builder-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ github.event.inputs.variant == 'Both' && fromJSON('["Suki-Kernel", "NoSU-Kernel"]') || (github.event.inputs.variant == 'NoSU-Kernel' && fromJSON('["NoSU-Kernel"]') || fromJSON('["Suki-Kernel"]')) }}

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev python3 libelf-dev \
            curl git zip tar xz-utils zlib1g-dev libncurses-dev ccache \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Cache LLVM Toolchain (Kernel.org 17.0.6)
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: toolchain
          key: llvm-17.0.6-x86_64

      - name: Setup LLVM Toolchain (Kernel.org 17.0.6)
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain
          echo "[+] Downloading LLVM 17.0.6 (proven MKP-safe compiler)..."
          curl -fL "https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-17.0.6-x86_64.tar.xz" | tar -I "xz -T0" -xf - -C toolchain --strip-components=1

      - name: Add LLVM to PATH
        run: |
          echo "${GITHUB_WORKSPACE}/toolchain/bin" >> $GITHUB_PATH

      - name: Setup Compiler Cache (ccache)
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ matrix.variant }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.variant }}-

      - name: Fetch Android Common Kernel 5.10
        run: |
          echo "[+] Cloning Android Common Kernel 5.10 (stg-damon branch, MKP-safe)..."
          git clone --depth 1 --single-branch --no-tags -b android12-5.10-stg-damon \
            https://github.com/ramabondanp/android_kernel_common-5.10.git kernel_src
          cd kernel_src

          # Lock sublevel to 270 — 271 is impossible (MKP struct mismatch on all builds)
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 270/' Makefile
          sed -i 's/^EXTRAVERSION = .*/EXTRAVERSION =/' Makefile
          echo "[+] Kernel sublevel locked to 5.10.270"

      - name: Integrate SukiSU-Ultra & SuSFS (Suki-Kernel only)
        if: matrix.variant == 'Suki-Kernel'
        run: |
          cd kernel_src
          echo "[+] Shallow cloning SukiSU-Ultra (builtin branch with pre-integrated SuSFS)..."
          git clone --depth 1 --single-branch -b builtin https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU

          echo "[+] Running upstream setup.sh to configure build system hooks..."
          bash KernelSU/kernel/setup.sh builtin

          # Verify integration
          echo "[+] Verifying SukiSU integration..."
          ls -la drivers/kernelsu/ || { echo "ERROR: symlink not created"; exit 1; }
          grep -q "kernelsu" drivers/Makefile || { echo "ERROR: Makefile not patched"; exit 1; }
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || { echo "ERROR: Kconfig not patched"; exit 1; }

          # Lock version cleanly to 40900 to match manager v4.2.0
          sed -i 's/^KSU_VERSION\s*:=.*/KSU_VERSION     := 40900/' KernelSU/kernel/Makefile 2>/dev/null || true
          sed -i 's/^KSU_VERSION_FULL\s*:=.*/KSU_VERSION_FULL := v4.2.0-Mehraan-SukiSU/' KernelSU/kernel/Makefile 2>/dev/null || true

          echo "[+] Fetching SuSFS for GKI 5.10 (simonpunk/susfs4ksu)..."
          git clone --depth 1 --single-branch -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git susfs

          echo "[+] Copying SuSFS kernel files..."
          cp -vf susfs/kernel_patches/fs/susfs.c fs/
          cp -vf susfs/kernel_patches/include/linux/susfs.h include/linux/
          cp -vf susfs/kernel_patches/include/linux/susfs_def.h include/linux/

          # Provide ksu_handle_post_execveat_sucompat symbol required by fs/exec.c
          echo -e "\nint ksu_handle_post_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv_user, void *envp_user, int *__never_use_flags, int *retval) { return 0; }" >> fs/susfs.c

          echo "[+] Adding safe static default stealth paths to fs/susfs.c..."
          python3 -c '
          c = open("fs/susfs.c").read()
          helper = """#ifdef CONFIG_KSU_SUSFS_SUS_PATH
          static void susfs_add_default_path_loop(const char *pathname) {
          \tstruct st_susfs_sus_path_list *new_list;
          \tnew_list = kzalloc(sizeof(struct st_susfs_sus_path_list), GFP_KERNEL);
          \tif (!new_list)
          \t\treturn;
          \tstrscpy(new_list->info.target_pathname, pathname, SUSFS_MAX_LEN_PATHNAME - 1);
          \tstrscpy(new_list->target_pathname, pathname, SUSFS_MAX_LEN_PATHNAME - 1);
          \tINIT_LIST_HEAD(&new_list->list);
          \tmutex_lock(&susfs_mutex_lock_sus_path);
          \tlist_add_tail_rcu(&new_list->list, &LH_SUS_PATH_LOOP);
          \tmutex_unlock(&susfs_mutex_lock_sus_path);
          }
          #endif
          """
          target = "void susfs_init(void) {"
          calls = """void susfs_init(void) {
          #ifdef CONFIG_KSU_SUSFS_SUS_PATH
          \tsusfs_add_default_path_loop("/system/addon.d");
          #endif"""
          assert target in c, "target not found in fs/susfs.c"
          c = c.replace(target, helper + "\n" + calls, 1)
          open("fs/susfs.c", "w").write(c)
          '

          echo "[+] Applying SuSFS 5.10 kernel patch..."
          patch -p1 < susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch

          # VMA_PAD_START fallback in task_mmu.c if not defined
          if grep -q 'VMA_PAD_START(' fs/proc/task_mmu.c && ! grep -qE '#include <linux/pgsize_migration(_inline)?\.h>|define VMA_PAD_START' fs/proc/task_mmu.c; then
            sed -i '1a #ifndef VMA_PAD_START\n#define VMA_PAD_START(vma) ((vma)->vm_end)\n#endif' fs/proc/task_mmu.c
            echo "[+] Added VMA_PAD_START fallback to task_mmu.c"
          fi

          # ═══════════════════════════════════════════════════════════════
          # STEALTH PATCH 1: Abstract Unix Socket seq_show Filtering (net/unix/af_unix.c)
          # Hides long random-named abstract sockets from /proc/net/unix for UID >= 10000.
          # CRITICAL: Hook ONLY unix_seq_show. Never touch __unix_find_socket_byname!
          # ═══════════════════════════════════════════════════════════════
          echo "[+] Applying stealth abstract socket filtering to unix_seq_show in net/unix/af_unix.c..."
          python3 -c '
          c = open("net/unix/af_unix.c").read()
          old_seq = "static int unix_seq_show(struct seq_file *seq, void *v)\n{"
          new_seq = """static int unix_seq_show(struct seq_file *seq, void *v)
          {
          #ifdef CONFIG_KSU_SUSFS
          \tif (v != SEQ_START_TOKEN && current_uid().val >= 10000) {
          \t\tstruct sock *s_check = v;
          \t\tstruct unix_sock *u_check = unix_sk(s_check);
          \t\tif (u_check && u_check->addr && UNIX_ABSTRACT(s_check)) {
          \t\t\tint plen = u_check->addr->len - sizeof(short);
          \t\t\tif (plen >= 32) return 0;
          \t\t}
          \t}
          #endif"""
          assert old_seq in c, "target unix_seq_show not found in net/unix/af_unix.c"
          open("net/unix/af_unix.c", "w").write(c.replace(old_seq, new_seq, 1))
          '

          # ═══════════════════════════════════════════════════════════════
          # STEALTH PATCH 2: Boot State Spoofing (fs/proc/cmdline.c)
          # Rewrites orange->green, locked=0->1, unlocked->locked in /proc/cmdline
          # for unprivileged processes. Uses exact length matches without memory overrun.
          # ═══════════════════════════════════════════════════════════════
          echo "[+] Applying boot state spoofing to fs/proc/cmdline.c..."
          python3 -c '
          c = open("fs/proc/cmdline.c").read()
          header = """#ifdef CONFIG_KSU_SUSFS
          #include <linux/cred.h>
          #include <linux/string.h>
          #include <linux/slab.h>
          #endif
          """
          target = "static int cmdline_proc_show(struct seq_file *m, void *v)\n{"
          stealth = """static int cmdline_proc_show(struct seq_file *m, void *v)
          {
          #ifdef CONFIG_KSU_SUSFS
          \tif (current_uid().val >= 10000) {
          \t\tchar *buf = kstrdup(saved_command_line, GFP_KERNEL);
          \t\tif (buf) {
          \t\t\tchar *p;
          \t\t\tif ((p = strstr(buf, "androidboot.verifiedbootstate=orange"))) memcpy(p + 30, "green ", 6);
          \t\t\tif ((p = strstr(buf, "androidboot.flash.locked=0"))) p[25] = "1"[0];
          \t\t\tif ((p = strstr(buf, "androidboot.vbmeta.device_state=unlocked"))) memcpy(p + 32, "locked  ", 8);
          \t\t\tseq_puts(m, buf);
          \t\t\tkfree(buf);
          \t\t\tseq_putc(m, '\''\\n'\'');
          \t\t\treturn 0;
          \t\t}
          \t}
          #endif"""
          assert target in c, "target not found in fs/proc/cmdline.c"
          open("fs/proc/cmdline.c", "w").write(header + c.replace(target, stealth, 1))
          '

          # ═══════════════════════════════════════════════════════════════
          # STEALTH PATCH 3: SELinux Policy Read Denial (security/selinux/selinuxfs.c)
          # Blocks raw binary SELinux policy reads for UID >= 10000.
          # Safely jumps to err label to release policy_mutex and avoid deadlock.
          # ═══════════════════════════════════════════════════════════════
          echo "[+] Applying SELinux policy read denial to security/selinux/selinuxfs.c..."
          python3 -c '
          c = open("security/selinux/selinuxfs.c").read()
          target = "rc = avc_has_perm(&selinux_state,\n\t\t\t  current_sid(), SECINITSID_SECURITY,\n\t\t\t  SECCLASS_SECURITY, SECURITY__READ_POLICY, NULL);"
          patch = """#ifdef CONFIG_KSU_SUSFS
          \tif (current_uid().val >= 10000) {
          \t\trc = -EACCES;
          \t\tgoto err;
          \t}
          #endif
          \t""" + target
          assert target in c, "target not found in security/selinux/selinuxfs.c"
          open("security/selinux/selinuxfs.c", "w").write(c.replace(target, patch, 1))
          '

          # ═══════════════════════════════════════════════════════════════
          # STEALTH PATCH 4: /proc/version Spoofing (fs/proc/version.c)
          # For UID >= 10000, replaces /proc/version output with stock-looking
          # compiler and hostname. Fixes leak of custom kernel name and CI hostname.
          # ═══════════════════════════════════════════════════════════════
          echo "[+] Applying /proc/version spoofing to fs/proc/version.c..."
          python3 -c '
          c = open("fs/proc/version.c").read()
          target = "static int version_proc_show(struct seq_file *m, void *v)\n{"
          header = """#ifdef CONFIG_KSU_SUSFS
          #include <linux/cred.h>
          #endif
          """
          patch = """static int version_proc_show(struct seq_file *m, void *v)
          {
          #ifdef CONFIG_KSU_SUSFS
          \tif (current_uid().val >= 10000) {
          \t\tseq_printf(m, "Linux version %s (%s@%s) (%s) %s\\n",
          \t\t\tutsname()->release, "build", "infinix",
          \t\t\t"Android (12426897, +pgo, +bolt, +lto, +mlgo, based on r522817) clang version 18.0.1",
          \t\t\tutsname()->version);
          \t\treturn 0;
          \t}
          #endif"""
          assert target in c, "target not found in fs/proc/version.c"
          c = header + c.replace(target, patch, 1)
          open("fs/proc/version.c", "w").write(c)
          '

          # ═══════════════════════════════════════════════════════════════
          # STEALTH PATCH 5: filename_lookup IS_ERR pointer safety (fs/namei.c)
          # Protects against kernel paging request faults when filename is ERR_PTR
          # ═══════════════════════════════════════════════════════════════
          echo "[+] Adding filename_lookup IS_ERR guard to fs/namei.c..."
          python3 -c '
          c = open("fs/namei.c").read()
          target = "int filename_lookup(int dfd, struct filename *name, unsigned int flags,\n\t\t    struct path *path, struct path *root)\n{"
          guard = """int filename_lookup(int dfd, struct filename *name, unsigned int flags,
          \t\t    struct path *path, struct path *root)
          {
          \tif (IS_ERR(name))
          \t\treturn PTR_ERR(name);
          \tif (!name)
          \t\treturn -EINVAL;"""
          if target in c:
              c = c.replace(target, guard, 1)
              open("fs/namei.c", "w").write(c)
              print("[+] filename_lookup guard added successfully")
          '

          echo "[+] Building ksu_module_susfs.zip..."
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          (cd susfs/ksu_module_susfs && zip -r9 "${GITHUB_WORKSPACE}/artifacts/ksu_module_susfs.zip" * -x "*.zip")

          echo "[+] SukiSU-Ultra v4.2.0 & SuSFS deep stealth engine integrated (6 clean stealth patches)"

      - name: Configure Kernel
        run: |
          cd kernel_src
          mkdir -p out

          # Pure Android Real Android Stock GKI Naming
          rm -f .scmversion
          touch .scmversion
          sed -i 's/scm_version="+.*/scm_version=""/' scripts/setlocalversion 2>/dev/null || true

          export PATH="${GITHUB_WORKSPACE}/toolchain/bin:$PATH"
          export LLVM=1 LLVM_IAS=1 ARCH=arm64 LTO=thin

          make O=out gki_defconfig

          # Authentic Stock Android GKI Versioning
          scripts/config --file out/.config \
            --set-str CONFIG_LOCALVERSION "-android12-9-00014-gf82f7360927e-ab14119954" \
            -d CONFIG_LOCALVERSION_AUTO

          # 1. Performance & Compiler Optimizations (ThinLTO, skip runtime CFI overhead on hot paths)
          scripts/config --file out/.config \
            -e LTO_CLANG -e LTO_CLANG_THIN -d LTO_CLANG_FULL -d LTO_NONE \
            -e CFI_FORCE_SKIP_CHECK \
            -d WERROR \
            -e OVERLAY_FS -e OVERLAY_FS_REDIRECT_ALWAYS_FOLLOW \
            --set-val CONFIG_FRAME_WARN 2048

          # 2. Battery Backup & Less Heat (Energy-Aware Scheduling, low-power idle sleep)
          scripts/config --file out/.config \
            -e ENERGY_MODEL \
            -e NO_HZ -e RCU_FAST_NO_HZ

          # 3. Peak Internet (Google BBR TCP Congestion Control as default for lowest latency & highest bandwidth)
          scripts/config --file out/.config \
            -e TCP_CONG_ADVANCED -e TCP_CONG_BBR -e DEFAULT_BBR \
            --set-str CONFIG_DEFAULT_TCP_CONG "bbr" \
            -e NETFILTER_XT_TARGET_TPROXY -e NETFILTER_XT_TARGET_DSCP

          # 4. Better RAM Management (Full DAMON Proactive Cold Page Reclaim)
          scripts/config --file out/.config \
            -e DAMON -e DAMON_PADDR -e DAMON_SYSFS -e DAMON_RECLAIM

          # 5. Peak I/O Performance & Pure Stock Dynamic Governors (evade custom governor detection)
          scripts/config --file out/.config \
            -e MQ_IOSCHED_ADIOS \
            -e IOSCHED_BFQ -e BFQ_GROUP_IOSCHED \
            -d CPU_FREQ_GOV_REFLEX -d CPU_FREQ_GOV_SCHEDHORIZON

          # 6. Full Kernel Modding Access (Kprobes, eBPF, and Runtime Loadable Kernel Modules)
          scripts/config --file out/.config \
            -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS \
            -e BPF_SYSCALL -e BPF_JIT \
            -e MODULES -e MODULE_UNLOAD -e MODVERSIONS

          # 7. Variant Specific (Suki-Kernel with SukiSU-Ultra, KPM, and Full SuSFS Stealth Engine)
          if [ "${{ matrix.variant }}" = "Suki-Kernel" ]; then
            echo "[+] Enabling SukiSU-Ultra root support, KPM kernelpatch engine, and SuSFS..."
            scripts/config --file out/.config \
              -e KSU \
              -e KPM \
              -e KSU_SUSFS \
              -e KSU_SUSFS_SUS_PATH \
              -e KSU_SUSFS_SUS_MOUNT \
              -e KSU_SUSFS_SUS_KSTAT \
              -e KSU_SUSFS_SPOOF_UNAME \
              -d KSU_SUSFS_ENABLE_LOG \
              -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
              -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              -e KSU_SUSFS_OPEN_REDIRECT \
              -e KSU_SUSFS_SUS_MAP
          else
            echo "[+] Configuring NoSU (pure stock, NO root, NO susfs)..."
            scripts/config --file out/.config \
              -d KSU -d KPM -d KSU_SUSFS
          fi

          make O=out olddefconfig savedefconfig

          # Force ENABLE_LOG=n AFTER olddefconfig (Kconfig default is y, olddefconfig resets it)
          if [ "${{ matrix.variant }}" = "Suki-Kernel" ]; then
            sed -i 's/CONFIG_KSU_SUSFS_ENABLE_LOG=y/# CONFIG_KSU_SUSFS_ENABLE_LOG is not set/' out/.config
            make O=out olddefconfig
            echo "[+] Forced KSU_SUSFS_ENABLE_LOG=n (prevents dmesg leaks)"
          fi

      - name: Compile Kernel (Image)
        run: |
          cd kernel_src
          export PATH="${GITHUB_WORKSPACE}/toolchain/bin:$PATH"

          # Configure ccache for fastest builds
          export CCACHE_DIR=/home/runner/.ccache
          export CCACHE_MAXSIZE=8G
          export CCACHE_COMPRESS=1
          export CCACHE_COMPRESSLEVEL=5
          ccache -s -z

          # Native stock naming from CONFIG_LOCALVERSION
          export LLVM=1 LLVM_IAS=1 ARCH=arm64 LOCALVERSION="" LTO=thin CCACHE=ccache

          # Build environment spoofing — stock OEM builder identity
          export KBUILD_BUILD_USER="build"
          export KBUILD_BUILD_HOST="infinix"
          export KBUILD_BUILD_TIMESTAMP="Mon Jan  1 00:00:00 UTC 2026"

          make -j$(nproc --all) O=out Image

          echo "[+] ccache statistics after build:"
          ccache -s

      - name: Package AnyKernel3 Zip
        run: |
          mkdir -p artifacts

          # Fresh upstream AnyKernel3
          rm -rf tools/AnyKernel3
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git tools/AnyKernel3

          # Apply template with variant name
          cp -vf tools/anykernel_template.sh tools/AnyKernel3/anykernel.sh
          sed -i "s/VARIANT/${{ matrix.variant }}/" tools/AnyKernel3/anykernel.sh
          rm -rf tools/AnyKernel3/ramdisk/overlay.d

          # Use Header v4-compatible magiskboot
          if [ -f "tools/magiskboot_arm64" ]; then
            cp -vf tools/magiskboot_arm64 tools/AnyKernel3/tools/magiskboot
            chmod +x tools/AnyKernel3/tools/magiskboot
          fi

          cp -v kernel_src/out/arch/arm64/boot/Image tools/AnyKernel3/Image
          cd tools/AnyKernel3
          zip -r9 "../../artifacts/${{ matrix.variant }}-5.10.270-Mehraan.zip" * -x ".git*" "README.md" "*.zip"
          cd ../..

      - name: Repack Stock boot.img
        run: |
          if [ -f "Stockimgs/boot.img" ]; then
            echo "[+] Repacking stock boot.img with new kernel..."
            python3 tools/repack_boot.py Stockimgs/boot.img \
              kernel_src/out/arch/arm64/boot/Image \
              "artifacts/${{ matrix.variant }}-5.10.270-boot.img"
          else
            echo "[-] No Stockimgs/boot.img found, skipping repack."
          fi

      - name: Include SukiSU Ultra Manager (Suki-Kernel only)
        if: matrix.variant == 'Suki-Kernel'
        run: |
          if [ -d "managers" ]; then
            echo "[+] Copying SukiSU Ultra Manager to artifacts..."
            cp -vf managers/SukiSU_Ultra_*.apk artifacts/
          fi

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-5.10.270-by-Mehraan
          path: artifacts/*
          if-no-files-found: error
