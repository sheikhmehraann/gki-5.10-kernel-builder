name: Build Suki-Kernel & NoSU-Kernel (5.10.270)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [Suki-Kernel, NoSU-Kernel]

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev python3 libelf-dev \
            curl git zip tar xz-utils zlib1g-dev libncurses-dev ccache \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Setup LLVM Toolchain (Kernel.org 17.0.6)
        run: |
          mkdir -p toolchain
          echo "[+] Downloading LLVM 17.0.6 (proven MKP-safe compiler)..."
          curl -fL "https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-17.0.6-x86_64.tar.xz" | tar -I "xz -T0" -xf - -C toolchain --strip-components=1
          echo "${GITHUB_WORKSPACE}/toolchain/bin" >> $GITHUB_PATH

      - name: Fetch Android Common Kernel 5.10
        run: |
          echo "[+] Cloning Android Common Kernel 5.10 (stg-damon branch, MKP-safe)..."
          git clone --depth 1 --single-branch --no-tags -b android12-5.10-stg-damon \
            https://github.com/ramabondanp/android_kernel_common-5.10.git kernel_src
          cd kernel_src

          # Lock sublevel to 270 — 271 is impossible (MKP struct mismatch on all builds)
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 270/' Makefile
          sed -i 's/^EXTRAVERSION = .*/EXTRAVERSION =/' Makefile
          echo "[+] Kernel sublevel locked to 5.10.270"

      - name: Integrate SukiSU-Ultra (Suki-Kernel only)
        if: matrix.variant == 'Suki-Kernel'
        run: |
          cd kernel_src
          echo "[+] Shallow cloning SukiSU-Ultra v4.2.0 for maximum build speed..."
          git clone --depth 1 --single-branch -b v4.2.0 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU

          echo "[+] Running upstream setup.sh to configure build system hooks..."
          bash KernelSU/kernel/setup.sh v4.2.0

          # Verify integration
          echo "[+] Verifying SukiSU integration..."
          ls -la drivers/kernelsu/ || { echo "ERROR: symlink not created"; exit 1; }
          grep -q "kernelsu" drivers/Makefile || { echo "ERROR: Makefile not patched"; exit 1; }
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || { echo "ERROR: Kconfig not patched"; exit 1; }

          # Lock version cleanly to 40900 to match manager v4.2.0
          sed -i 's/^KSU_VERSION\s*:=.*/KSU_VERSION     := 40900/' KernelSU/kernel/Kbuild
          sed -i 's/^KSU_VERSION_FULL\s*:=.*/KSU_VERSION_FULL := v4.2.0-Mehraan-SukiSU/' KernelSU/kernel/Kbuild

          echo "[+] SukiSU-Ultra v4.2.0 integrated (pure upstream, zero custom patches)"

      - name: Configure Kernel
        run: |
          cd kernel_src
          mkdir -p out

          # Proper naming: Clean version string with zero duplication
          rm -f .scmversion

          export PATH="${GITHUB_WORKSPACE}/toolchain/bin:$PATH"
          export LLVM=1 LLVM_IAS=1 ARCH=arm64 LTO=thin

          make O=out gki_defconfig

          # 1. Performance & Compiler Optimizations (ThinLTO, skip runtime CFI overhead on hot paths)
          scripts/config --file out/.config \
            -e LTO_CLANG -e LTO_CLANG_THIN -d LTO_CLANG_FULL -d LTO_NONE \
            -e CFI_FORCE_SKIP_CHECK \
            -d WERROR \
            -e OVERLAY_FS -e OVERLAY_FS_REDIRECT_ALWAYS_FOLLOW \
            --set-val CONFIG_FRAME_WARN 2048

          # 2. Battery Backup & Less Heat (Energy-Aware Scheduling, low-power idle sleep)
          scripts/config --file out/.config \
            -e ENERGY_MODEL \
            -e NO_HZ -e RCU_FAST_NO_HZ

          # 3. Peak Internet (Google BBR TCP Congestion Control as default for lowest latency & highest bandwidth)
          scripts/config --file out/.config \
            -e TCP_CONG_ADVANCED -e TCP_CONG_BBR -e DEFAULT_BBR \
            --set-str CONFIG_DEFAULT_TCP_CONG "bbr" \
            -e NETFILTER_XT_TARGET_TPROXY -e NETFILTER_XT_TARGET_DSCP

          # 4. Better RAM Management (Full DAMON Proactive Cold Page Reclaim)
          scripts/config --file out/.config \
            -e DAMON -e DAMON_PADDR -e DAMON_SYSFS -e DAMON_RECLAIM

          # 5. Peak I/O Performance & Dynamic Governors
          scripts/config --file out/.config \
            -e MQ_IOSCHED_ADIOS \
            -e IOSCHED_BFQ -e BFQ_GROUP_IOSCHED \
            -e CPU_FREQ_GOV_REFLEX -e CPU_FREQ_GOV_SCHEDHORIZON

          # 6. Full Kernel Modding Access (Kprobes, eBPF, and Runtime Loadable Kernel Modules)
          scripts/config --file out/.config \
            -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS \
            -e BPF_SYSCALL -e BPF_JIT \
            -e MODULES -e MODULE_UNLOAD -e MODVERSIONS

          # 7. Variant Specific (Suki-Kernel with SukiSU-Ultra & KPM Module Engine)
          if [ "${{ matrix.variant }}" = "Suki-Kernel" ]; then
            echo "[+] Enabling SukiSU-Ultra root support & KPM kernelpatch engine..."
            scripts/config --file out/.config \
              -e KSU \
              -e KPM
          else
            echo "[+] Configuring NoSU (pure stock, NO root)..."
            scripts/config --file out/.config \
              -d KSU -d KPM
          fi

          make O=out olddefconfig savedefconfig

      - name: Compile Kernel (Image)
        run: |
          cd kernel_src
          export PATH="${GITHUB_WORKSPACE}/toolchain/bin:$PATH"

          # Clean naming: 5.10.270-Mehraan-Suki-Kernel or 5.10.270-Mehraan-NoSU-Kernel
          LOCALVER="-Mehraan-${{ matrix.variant }}"

          export LLVM=1 LLVM_IAS=1 ARCH=arm64 LOCALVERSION="$LOCALVER" LTO=thin
          make -j$(nproc --all) O=out Image

      - name: Package AnyKernel3 Zip
        run: |
          mkdir -p artifacts

          # Fresh upstream AnyKernel3
          rm -rf tools/AnyKernel3
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git tools/AnyKernel3

          # Apply template with variant name
          cp -vf tools/anykernel_template.sh tools/AnyKernel3/anykernel.sh
          sed -i "s/VARIANT/${{ matrix.variant }}/" tools/AnyKernel3/anykernel.sh
          rm -rf tools/AnyKernel3/ramdisk/overlay.d

          # Use Header v4-compatible magiskboot
          if [ -f "tools/magiskboot_arm64" ]; then
            cp -vf tools/magiskboot_arm64 tools/AnyKernel3/tools/magiskboot
            chmod +x tools/AnyKernel3/tools/magiskboot
          fi

          cp -v kernel_src/out/arch/arm64/boot/Image tools/AnyKernel3/Image
          cd tools/AnyKernel3
          zip -r9 "../../artifacts/${{ matrix.variant }}-5.10.270-Mehraan.zip" * -x ".git*" "README.md" "*.zip"
          cd ../..

      - name: Repack Stock boot.img
        run: |
          if [ -f "Stockimgs/boot.img" ]; then
            echo "[+] Repacking stock boot.img with new kernel..."
            python3 tools/repack_boot.py Stockimgs/boot.img \
              kernel_src/out/arch/arm64/boot/Image \
              "artifacts/${{ matrix.variant }}-5.10.270-boot.img"
          else
            echo "[-] No Stockimgs/boot.img found, skipping repack."
          fi

      - name: Include SukiSU Ultra Manager (Suki-Kernel only)
        if: matrix.variant == 'Suki-Kernel'
        run: |
          if [ -d "managers" ]; then
            echo "[+] Copying SukiSU Ultra Manager to artifacts..."
            cp -vf managers/SukiSU_Ultra_*.apk artifacts/
          fi

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-5.10.270-by-Mehraan
          path: artifacts/*
          if-no-files-found: error
